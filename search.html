<body class="bg-[#f5f5f7] dark:bg-black dark:text-[#f5f5f7] text-[#1d1d1f] min-h-screen flex flex-col transition-colors duration-200 font-sans">
    <script type="module" src="./src/js/navbar.js"></script>

    <main class="flex-grow container mx-auto px-4 pt-24 pb-12 max-w-5xl">
        <div class="mb-12">
            <h1 class="text-3xl font-bold mb-6">검색 결과</h1>
            <div class="relative group">
                <input type="text" id="subject-search" 
                    placeholder="다른 과목 검색..." 
                    class="w-full px-6 py-4 rounded-2xl bg-white dark:bg-[#1d1d1f] border border-[#d2d2d7] dark:border-[#424245] shadow-lg focus:ring-4 focus:ring-[#0071e3]/20 focus:border-[#0071e3] outline-none transition-all">
                <div id="search-results" class="absolute top-full left-0 right-0 mt-2 bg-white dark:bg-[#1d1d1f] rounded-2xl border border-[#d2d2d7] dark:border-[#424245] shadow-2xl overflow-hidden hidden z-10"></div>
            </div>
        </div>

        <div id="search-page-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Results injected here -->
            <p class="col-span-full text-center text-[#6e6e73] my-12">검색어를 입력해주세요.</p>
        </div>
    </main>

    <!-- Modal for Adding Subject -->
    <div id="add-subject-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-[#1d1d1f] w-full max-w-md rounded-3xl p-8 shadow-2xl border border-[#d2d2d7] dark:border-[#424245]">
            <h2 class="text-2xl font-bold mb-6">새 과목 추가</h2>
            <form id="add-subject-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">과목 코드 (4자리)</label>
                    <input type="text" id="new-subject-code" maxlength="4" required class="w-full px-4 py-2 rounded-xl border dark:bg-black dark:border-[#424245]">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">과목명</label>
                    <input type="text" id="new-subject-name" required class="w-full px-4 py-2 rounded-xl border dark:bg-black dark:border-[#424245]">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">교수명</label>
                    <input type="text" id="new-subject-prof" required class="w-full px-4 py-2 rounded-xl border dark:bg-black dark:border-[#424245]">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">연도</label>
                        <input type="number" id="new-subject-year" class="w-full px-4 py-2 rounded-xl border dark:bg-black dark:border-[#424245]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">학기</label>
                        <select id="new-subject-semester" class="w-full px-4 py-2 rounded-xl border dark:bg-black dark:border-[#424245]">
                            <option value="1학기">1학기</option>
                            <option value="여름학기">여름학기</option>
                            <option value="2학기" selected>2학기</option>
                            <option value="겨울학기">겨울학기</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 mt-8">
                    <button type="button" id="btn-close-modal" class="flex-1 px-4 py-2 rounded-full border border-[#d2d2d7] dark:border-[#424245]">취소</button>
                    <button type="submit" class="flex-1 px-4 py-2 rounded-full bg-[#0071e3] text-white">추가하기</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="mt-20 pb-12 w-full max-w-5xl mx-auto border-t border-[#d2d2d7] dark:border-[#424245] pt-8 flex flex-col items-center space-y-4">
        <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-6 text-[13px] font-medium text-[#6e6e73] dark:text-gray-400">
            <p>Made by <span class="text-[#1d1d1f] dark:text-white">sjHan</span></p>
            <div class="hidden sm:block w-px h-3 bg-[#d2d2d7] dark:bg-[#424245]"></div>
            <a href="mailto:han123400040@gmail.com" class="hover:text-[#0071e3] transition-colors">han123400040@gmail.com</a>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-3">
            <a href="https://forms.gle/D9Vcg5y2LZNDpLFRA" target="_blank" 
               class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#0071e3] text-white text-[13px] font-semibold hover:bg-[#0077ED] transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span>버그 제보 및 개선 피드백</span>
            </a>
            
            <a href="https://buymeacoffee.com/daybreaker42" target="_blank" 
               class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white dark:bg-[#1d1d1f] border border-[#d2d2d7] dark:border-[#424245] text-[13px] font-semibold text-[#1d1d1f] dark:text-white hover:bg-[#f5f5f7] dark:hover:bg-[#2c2c2e] transition-all shadow-sm">
                <img src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg" alt="BMC" class="h-4 w-4">
                <span>Buy me a coffee</span>
            </a>
        </div>

        <p class="text-[11px] text-[#86868b] dark:text-gray-500 mt-2">© <span class="current-year">2026</span> sjHan. All rights reserved.</p>
    </footer>

    <script type="module" src="./src/js/predictor.js"></script>
    <script type="module">
        import { db, collection, getDocs } from './src/js/firebase-config.js';
        
        const urlParams = new URLSearchParams(window.location.search);
        const term = urlParams.get('q');
        const resultsContainer = document.getElementById('search-page-results');
        
        if (term) {
            document.getElementById('subject-search').value = term;
            performSearch(term);
        }

        async function performSearch(term) {
            resultsContainer.innerHTML = '<p class="col-span-full text-center text-[#6e6e73] my-12 animate-pulse">검색 중...</p>';
            
            try {
                const snapshot = await getDocs(collection(db, 'subjects'));
                const all = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const filtered = all.filter(s => 
                    s.code.toLowerCase().includes(term.toLowerCase()) || 
                    s.name.toLowerCase().includes(term.toLowerCase()) || 
                    s.professor.toLowerCase().includes(term.toLowerCase())
                );

                resultsContainer.innerHTML = '';
                if (filtered.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <p class="text-[#6e6e73] mb-4">검색 결과가 없습니다.</p>
                            <button onclick="document.getElementById('add-subject-modal').classList.remove('hidden'); document.getElementById('new-subject-name').value = '${term.replace(/'/g, "\\'")}';" class="text-[#0071e3] font-bold hover:underline">
                                과목 직접 추가하기 +
                            </button>
                        </div>
                    `;
                    return;
                }

                filtered.forEach(subject => {
                    const card = document.createElement('a');
                    card.href = `subject.html?id=${subject.id}`;
                    card.className = 'group p-6 rounded-2xl bg-white dark:bg-[#1d1d1f] border border-[#d2d2d7] dark:border-[#424245] hover:shadow-xl transition-all flex flex-col justify-between h-40';
                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-[#0071e3] bg-[#0071e3]/10 px-2 py-1 rounded-md uppercase tracking-wider">${subject.code}</span>
                                <span class="text-xs text-[#6e6e73] dark:text-gray-400">${subject.year} ${subject.semester}</span>
                            </div>
                            <h3 class="text-lg font-bold group-hover:text-[#0071e3] transition-colors line-clamp-1">${subject.name}</h3>
                            <p class="text-sm text-[#6e6e73] dark:text-gray-400">${subject.professor} 교수님</p>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = '<p class="col-span-full text-center text-red-500 my-12">검색 중 오류가 발생했습니다.</p>';
            }
        }
    </script>
</body>
</html>
