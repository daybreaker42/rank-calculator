<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>표준분포 학점 계산기</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 md:p-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-blue-700 mb-4">표준분포 학점 계산기</h1>

    <!-- grid-cols-1로 모바일에서 한 줄, md:grid-cols-2로 데스크톱/태블릿에서 두 줄로 배치 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 w-full max-w-xs sm:max-w-md md:max-w-xl">
        <label for="mean" class="flex items-center space-x-2">
            <span>평균(μ)</span>
            <input id="mean" type="number" placeholder="예: 70" class="input" />
        </label>
        <label for="stddev" class="flex items-center space-x-2">
            <span>표준편차(σ)</span>
            <input id="stddev" type="number" placeholder="예: 10" class="input" />
        </label>
        <label for="population" class="flex items-center space-x-2">
            <span>전체 인원수(N)</span>
            <input id="population" type="number" placeholder="예: 100" class="input" />
        </label>
        <label for="score" class="flex items-center space-x-2">
            <span>내 점수(X)</span>
            <input id="score" type="number" placeholder="예: 85" class="input" />
        </label>
    </div>

    <button onclick="calculateAndDraw()"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 w-full sm:w-auto">계산하기</button>

    <!-- 학점 구간별 경계값/상위% 표 영역 추가 (버튼 아래에 위치) -->
    <div id="grade-table"></div>
    
    <!-- 결과 영역도 반응형 max-width 적용 -->
    <div class="mt-6 w-full max-w-xs sm:max-w-md md:max-w-2xl">
        <canvas id="chartCanvas"></canvas>
    </div>

    <div id="result" class="mt-6 text-lg font-medium text-gray-800"></div>

    <style>
        .input {
            /* Tailwind @apply는 빌드 환경에서만 동작하므로, 실제 배포시에는 인라인 클래스를 권장 */
            @apply border border-gray-300 p-2 rounded w-full;
        }
    </style>

    <script src="script.js"></script>
</body>
</html>
