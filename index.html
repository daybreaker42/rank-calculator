<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard Distribution Rank Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
    <h1 class="text-2xl font-bold mb-4">🎯 정규분포 기반 등수 계산기</h1>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <input id="mean" type="number" placeholder="평균 (μ)" class="p-2 border rounded" />
      <input id="stddev" type="number" placeholder="표준편차 (σ)" class="p-2 border rounded" />
      <input id="n" type="number" placeholder="모집단 수 (n)" class="p-2 border rounded" />
      <input id="score" type="number" placeholder="내 점수 (x)" class="p-2 border rounded" />
    </div>
    <button onclick="calculate()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">계산하기</button>

    <div class="mt-6">
      <canvas id="chart" height="100"></canvas>
    </div>

    <div id="result" class="mt-6 text-xl font-semibold text-gray-700"></div>
  </div>

  <script>
    let chart;

    function normalPDF(x, mean, std) {
      return (1 / (std * Math.sqrt(2 * Math.PI))) *
             Math.exp(-0.5 * Math.pow((x - mean) / std, 2));
    }

    function normalCDF(z) {
      // 근사 계산
      return 0.5 * (1 + erf(z / Math.sqrt(2)));
    }

    function erf(x) {
      // 수치 해석용 erf 근사
      const sign = x >= 0 ? 1 : -1;
      x = Math.abs(x);
      const a1 = 0.254829592,
            a2 = -0.284496736,
            a3 = 1.421413741,
            a4 = -1.453152027,
            a5 = 1.061405429,
            p = 0.3275911;

      const t = 1 / (1 + p * x);
      const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
      return sign * y;
    }

    function calculate() {
      const mean = parseFloat(document.getElementById("mean").value);
      const std = parseFloat(document.getElementById("stddev").value);
      const n = parseInt(document.getElementById("n").value);
      const x = parseFloat(document.getElementById("score").value);

      if (isNaN(mean) || isNaN(std) || isNaN(n) || isNaN(x)) {
        alert("모든 값을 정확히 입력해주세요!");
        return;
      }

      const z = (x - mean) / std;
      const p = normalCDF(z);
      const rank = Math.round(n * (1 - p));

      document.getElementById("result").innerText = `✨ 내 점수는 상위 ${((1 - p) * 100).toFixed(2)}%에 해당하며, 예상 등수는 약 ${rank}등입니다.`;

      // 그래프 재생성
      const xValues = [], yValues = [];
      for (let i = mean - 4 * std; i <= mean + 4 * std; i += std / 20) {
        xValues.push(i.toFixed(2));
        yValues.push(normalPDF(i, mean, std));
      }

      if (chart) chart.destroy();
      const ctx = document.getElementById("chart").getContext("2d");
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: xValues,
          datasets: [{
            label: '정규분포',
            data: yValues,
            borderColor: 'blue',
            borderWidth: 2,
            fill: false
          },
          {
            label: '내 점수',
            data: xValues.map(val => parseFloat(val) === x ? normalPDF(x, mean, std) : null),
            pointBackgroundColor: 'red',
            pointRadius: 6,
            type: 'scatter'
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }
  </script>
</body>
</html>
