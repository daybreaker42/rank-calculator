<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- 파비콘 추가 -->
    <title>성적 예상 등수 계산기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 다크모드 설정을 위한 Tailwind 설정 추가 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body
    class="bg-gray-50 dark:bg-gray-900 dark:text-white min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 md:p-6 transition-colors duration-200">
    <!-- 다크모드 토글 버튼 추가 -->
    <div class="absolute top-4 right-4">
        <button id="theme-toggle"
            class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-400">
            <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                    fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
            <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
        </button>
    </div>

    <h1 class="text-2xl sm:text-3xl font-bold text-blue-700 dark:text-blue-300 mb-4">성적 예상 등수 계산기</h1>

    <!-- 정규분포 계산에 관한 주의사항 추가 -->
    <div
        class="bg-yellow-50 dark:bg-yellow-900 border-l-4 border-yellow-400 p-3 mb-4 w-full max-w-xs sm:max-w-md md:max-w-xl">
        <p class="text-sm text-yellow-700 dark:text-yellow-200">
            <span class="font-medium">참고:</span> 정규분포식은 실제 데이터와 일치하지 않을 수 있으며, 데이터가 정규분포일 때를 기준으로 계산합니다.
        </p>
    </div>

    <!-- grid-cols-1로 모바일에서 한 줄, md:grid-cols-2로 데스크톱/태블릿에서 두 줄로 배치 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 w-full max-w-xs sm:max-w-md md:max-w-xl">
        <label for="mean" class="flex items-center space-x-2">
            <span class="w-16">평균(μ)</span>
            <input id="mean" type="tel" placeholder="예: 70" class="input" />
        </label>
        <label for="stddev" class="flex items-center space-x-2">
            <span class="w-16">표준편차(σ)</span>
            <input id="stddev" type="tel" placeholder="예: 10" class="input" />
        </label>
        <label for="population" class="flex items-center space-x-2">
            <span class="w-16">전체 인원수(N)</span>
            <input id="population" type="tel" placeholder="예: 100" class="input" />
        </label>
        <label for="score" class="flex items-center space-x-2">
            <span class="w-16">내 점수(X)</span>
            <input id="score" type="tel" placeholder="예: 85" class="input" />
        </label>
        <!-- 최소/최대 점수 입력 필드 추가 -->
        <label for="min-score" class="flex items-center space-x-2">
            <span class="w-16">최소 점수</span>
            <input id="min-score" type="tel" placeholder="예: 0" class="input" />
        </label>
        <label for="max-score" class="flex items-center space-x-2">
            <span class="w-16">최대 점수</span>
            <input id="max-score" type="tel" placeholder="예: 100" class="input" />
        </label>
        </div>
        
        <!-- 점수 제한에 대한 설명 추가 -->
        <div class="mb-4 w-full max-w-xs sm:max-w-md md:max-w-xl text-sm text-gray-700 dark:text-gray-300">
            <p>* 최소/최대 점수를 입력하면 해당 범위 내에서 정규분포를 조정하여 등수와 학점을 계산합니다.</p>
    </div>

    <div class="flex gap-4 w-full max-w-xs sm:max-w-md justify-center">
        <button onclick="calculateAndDraw()"
            class="bg-blue-600 dark:bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-800 w-full sm:w-auto">
            계산하기
        </button>
        <button onclick="clearInputValues()" 
            class="bg-yellow-500 dark:bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 dark:hover:bg-yellow-700 w-full sm:w-auto">
            값 비우기
        </button>
    </div>

    <!-- 결과 영역도 반응형 max-width 적용 -->
    <div class="mt-6 w-full max-w-[1000px]">
        <div class="flex items-center justify-end mb-2 gap-2">
            <span class="text-sm text-gray-700 dark:text-gray-300">X축:</span>
            <label class="inline-flex items-center cursor-pointer">
                <span class="mr-2 text-sm text-gray-700 dark:text-gray-300">점수</span>
                <div class="relative">
                    <input type="checkbox" id="chart-type-toggle" class="sr-only peer">
                    <div
                        class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600">
                    </div>
                </div>
                <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">상위 백분율</span>
            </label>
        </div>
        <div class="relative h-[200px]">
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>
        
    <!-- 결과 표시 영역을 버튼 바로 아래로 이동 -->
    <div id="result"
        class="mt-4 text-lg font-medium text-gray-800 dark:text-gray-200 text-center w-full max-w-xs sm:max-w-md md:max-w-xl">
    </div>

    <!-- 학점 구간별 경계값/상위% 표 영역 -->
    <div id="grade-table" class="mt-4 w-full max-w-xs sm:max-w-md md:max-w-xl"></div>

    <!-- 학점 구간 커스텀 UI 추가 -->
    <div class="mt-8 w-full max-w-xs sm:max-w-md md:max-w-xl">
        <h2 class="text-xl font-semibold mb-2">학점 구간 설정</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">* 상위 백분율을 기준으로 학점 구간이 설정됩니다. 예: 90은 상위 90%를 의미</p>
        <!-- 컬럼 헤더 추가 -->
        <div class="grid grid-cols-4 gap-2 mb-2 px-2">
            <div class="font-medium text-gray-700 dark:text-gray-300 text-center">학점명</div>
            <div class="font-medium text-gray-700 dark:text-gray-300 text-center">상위 백분율</div>
            <div class="font-medium text-gray-700 dark:text-gray-300 text-center">순서 변경</div>
            <div class="font-medium text-gray-700 dark:text-gray-300 text-center">삭제</div>
        </div>
        <div id="grade-bands-editor" class="space-y-2">
            <!-- JS에서 동적으로 학점 구간 입력 행 생성 -->
        </div>
        <button onclick="addGradeBandRow()"
            class="mt-2 text-sm bg-green-500 dark:bg-green-600 text-white px-2 py-1 rounded hover:bg-green-600 dark:hover:bg-green-700">구간 추가</button>
    </div>
    

    <div class="mt-4 w-full max-w-xs sm:max-w-md text-center">
        <button onclick="resetAllData()"
            class="bg-red-600 dark:bg-red-700 text-white px-4 py-2 rounded-lg hover:bg-red-700 dark:hover:bg-red-800">
            설정 초기화
        </button>
    </div>

    <style>
        /* input 기본 스타일 (주석) */
        .input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            min-height: 2.5rem;
            font-size: 1rem;
            background-color: white;
            color: #111827;
        }
        
        /* 다크모드 input 스타일 (주석) */
        html.dark .input {
            background-color: #374151;
            border-color: #4B5563;
            color: #F9FAFB;
        }
        
        /* 입력 필드 포커스 스타일 (주석) */
        .input:focus {
            outline: none;
            border-color: transparent;
            box-shadow: 0 0 0 2px #3B82F6;
        }
        
        html.dark .input:focus {
            box-shadow: 0 0 0 2px #60A5FA;
        }
        
        /* 버튼 기본 스타일 (주석) */
        button {
            transition: all 0.2s;
        }
        
        button:focus {
            outline: none;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #3B82F6;
        }
        
        html.dark button:focus {
            box-shadow: 0 0 0 2px #1F2937, 0 0 0 4px #60A5FA;
        }
        
        /* 모바일에서 터치 영역 확장 (주석) */
        @media (max-width: 640px) {
            .input, button:not(.grade-band-row button) {
                min-height: 3rem;
                font-size: 1.125rem;
            }
            
            .grade-band-row button {
                min-width: 2.5rem;
                min-height: 2.5rem;
            }
        }
    </style>
    
    <!-- Footer 추가 -->
    <footer class="mt-8 pb-4 text-center text-gray-600 dark:text-gray-400 text-sm">
        <p>Made by HanSJ</p>
        <p>Contact: <a href="mailto:han123400040@gmail.com"
                class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">han123400040@gmail.com</a>
        </p>
    </footer>
    <script src="math.js"></script>
    <script src="storage.js"></script>
    <script src="render.js"></script>
    <script src="script.js"></script>
</body>
</html>
