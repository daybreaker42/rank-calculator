<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- 파비콘 추가 -->
    <title>성적 예상 등수 계산기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 md:p-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-blue-700 mb-4">성적 예상 등수 계산기</h1>

    <!-- grid-cols-1로 모바일에서 한 줄, md:grid-cols-2로 데스크톱/태블릿에서 두 줄로 배치 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 w-full max-w-xs sm:max-w-md md:max-w-xl">
        <label for="mean" class="flex items-center space-x-2">
            <span class="w-16">평균(μ)</span>
            <input id="mean" type="number" placeholder="예: 70" class="input" />
        </label>
        <label for="stddev" class="flex items-center space-x-2">
            <span class="w-16">표준편차(σ)</span>
            <input id="stddev" type="number" placeholder="예: 10" class="input" />
        </label>
        <label for="population" class="flex items-center space-x-2">
            <span class="w-16">전체 인원수(N)</span>
            <input id="population" type="number" placeholder="예: 100" class="input" />
        </label>
        <label for="score" class="flex items-center space-x-2">
            <span class="w-16">내 점수(X)</span>
            <input id="score" type="number" placeholder="예: 85" class="input" />
        </label>
    </div>

    <div class="flex gap-4 w-full max-w-xs sm:max-w-md justify-center">
        <button onclick="calculateAndDraw()"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 w-full sm:w-auto">
            계산하기
        </button>
        <button onclick="clearInputValues()" 
            class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 w-full sm:w-auto">
            값 비우기
        </button>
    </div>

    <!-- 결과 영역도 반응형 max-width 적용 -->
    <div class="mt-6 w-full max-w-[1000px]">
        <div class="flex items-center justify-end mb-2 gap-2">
            <span class="text-sm text-gray-700">X축:</span>
            <label class="inline-flex items-center cursor-pointer">
                <span class="mr-2 text-sm text-gray-700">점수</span>
                <div class="relative">
                    <input type="checkbox" id="chart-type-toggle" class="sr-only peer">
                    <div
                        class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600">
                    </div>
                </div>
                <span class="ml-2 text-sm text-gray-700">상위 백분율</span>
            </label>
        </div>
        <div class="relative h-[200px]">
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>
        
    <!-- 결과 표시 영역을 버튼 바로 아래로 이동 -->
    <div id="result" class="mt-4 text-lg font-medium text-gray-800 text-center w-full max-w-xs sm:max-w-md md:max-w-xl">
    </div>

    <!-- 학점 구간별 경계값/상위% 표 영역 -->
    <div id="grade-table" class="mt-4 w-full max-w-xs sm:max-w-md md:max-w-xl"></div>

    <!-- 학점 구간 커스텀 UI 추가 -->
    <div class="mt-8 w-full max-w-xs sm:max-w-md md:max-w-xl">
        <h2 class="text-xl font-semibold mb-2">학점 구간 설정</h2>
        <p class="text-sm text-gray-600 mb-4">* 상위 백분율을 기준으로 학점 구간이 설정됩니다. 예: 90은 상위 90%를 의미</p>
        <!-- 컬럼 헤더 추가 -->
        <div class="grid grid-cols-4 gap-2 mb-2 px-2">
            <div class="font-medium text-gray-700 text-center">학점명</div>
            <div class="font-medium text-gray-700 text-center">상위 백분율</div>
            <div class="font-medium text-gray-700 text-center">순서 변경</div>
            <div class="font-medium text-gray-700 text-center">삭제</div>
        </div>
        <div id="grade-bands-editor" class="space-y-2">
            <!-- JS에서 동적으로 학점 구간 입력 행 생성 -->
        </div>
        <button onclick="addGradeBandRow()"
            class="mt-2 text-sm bg-green-500 text-white px-2 py-1 rounded hover:bg-green-600">구간 추가</button>
    </div>
    

    <div class="mt-4 w-full max-w-xs sm:max-w-md text-center">
        <button onclick="resetAllData()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
            설정 초기화
        </button>
    </div>

    <style>
        /* input 기본 스타일 (주석) */
        .input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            min-height: 2.5rem;
            font-size: 1rem;
        }
        
        /* 입력 필드 포커스 스타일 (주석) */
        .input:focus {
            outline: none;
            border-color: transparent;
            box-shadow: 0 0 0 2px #3B82F6;
        }
        
        /* 버튼 기본 스타일 (주석) */
        button {
            transition: all 0.2s;
        }
        
        button:focus {
            outline: none;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #3B82F6;
        }
        
        /* 모바일에서 터치 영역 확장 (주석) */
        @media (max-width: 640px) {
            .input, button:not(.grade-band-row button) {
                min-height: 3rem;
                font-size: 1.125rem;
            }
            
            .grade-band-row button {
                min-width: 2.5rem;
                min-height: 2.5rem;
            }
        }
    </style>
    
    <!-- Footer 추가 -->
    <footer class="mt-8 pb-4 text-center text-gray-600 text-sm">
        <p>Made by HanSJ</p>
        <p>Contact: <a href="mailto:han123400040@gmail.com" class="text-blue-600 hover:text-blue-800">han123400040@gmail.com</a>
        </p>
    </footer>
    <script src="math.js"></script>
    <script src="storage.js"></script>
    <script src="render.js"></script>
    <script src="script.js"></script>
</body>
</html>
